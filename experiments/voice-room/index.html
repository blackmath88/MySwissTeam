<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:," />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Gschwätz</title>
    <link rel="stylesheet" href="./src/styles/app.css" />
  </head>
  <body data-state="idle">
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <main id="entry">
      <p class="wordmark">Gschwätz</p>
      <h1 class="question">Can you understand a position you strongly disagree with?</h1>
      <p class="topic">Swiss women's suffrage, 1971</p>
      <button id="enter" class="enter" type="button">Enter the conversation</button>
      <p class="hint">Uses your microphone. No buttons — just talk.</p>
      <p id="entry-error" class="entry-error" role="alert"></p>
    </main>

    <nav class="room-chrome" aria-label="Room">
      <button id="leave" class="quiet" type="button">Leave</button>
      <button id="captions" class="quiet" type="button" aria-pressed="true" aria-label="Subtitles">CC</button>
    </nav>

    <p id="subtitles" class="subtitles" aria-live="off"></p>
    <p id="status" class="sr-only" aria-live="polite"></p>

    <script type="module" src="./src/App.js"></script>
  </body>
</html>
